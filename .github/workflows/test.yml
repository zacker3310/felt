name: tests

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suites:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright-core install --with-deps --no-shell chromium
      # the layout checks measure with Inter (closest to SF Pro), as a phone would; see tests/fonts
      - run: |
          sudo apt-get install -y fonts-inter
          mkdir -p ~/.config/fontconfig/conf.d
          cp tests/fonts/prefer-inter.conf ~/.config/fontconfig/conf.d/56-prefer-inter.conf
          fc-cache -f
          fc-match system-ui | tee /dev/stderr | grep -q Inter
      - run: npm run lint
      - run: npm test
